<style>
/* Formation (même structure que basket-betclic-asvel.html) — utilisé seulement si l'équipe a un champ "formation" */
.club-logo{display:flex;justify-content:center;margin:8px 0 28px}
.club-logo img{width:clamp(110px,22vw,190px);height:auto}
.formation{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3vw,30px);padding:0 10px;max-width:1000px;margin:0 auto 40px}
.f-row{display:flex;justify-content:center;gap:clamp(8px,2.4vw,28px);width:100%}
.slot{width:clamp(104px,28vw,220px);text-align:center;flex:0 0 auto}
.slot .card,.slot .frame{width:100%;margin:0}
.slot .frame img{width:100%;height:auto;display:block}
.slot h3{font-size:clamp(.72rem,2.2vw,1rem);margin:.5em 0 .2em;line-height:1.2}
.slot .price{margin:0 0 .4em}
.slot.empty .ph{aspect-ratio:5/7;border:1px dashed rgba(128,128,128,.55);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;padding:6px;opacity:.7}
.slot.empty .ph b{font-size:clamp(1.1rem,4vw,1.8rem);font-weight:500}
.slot.empty .ph span{font-size:clamp(.65rem,2vw,.85rem);line-height:1.2}
.jeux{display:none}
.jeu-btn{font:inherit;font-size:.8rem;cursor:pointer;background:transparent;color:inherit;border:1px solid rgba(128,128,128,.6);border-radius:999px;padding:2px 10px}
.jeu-btn.on{background:rgba(128,128,128,.28)}
.club-cards-title{text-align:center;margin:10px 0 0;font-weight:500}
.club-cards{display:flex;justify-content:center;gap:1.3rem;flex-wrap:wrap;margin-bottom:2.2rem}
.club-cards .card{width:clamp(140px,40vw,220px)}
.f-row.b-solo,.f-row.b-duo{gap:clamp(14px,6vw,70px)}
/* Formation en pyramide : les rangées s'écartent de plus en plus (meneur / arrière+ailier / ailier fort+pivot).
   Tout est calculé à partir de la largeur d'une carte (--w), donc ça s'adapte à l'écran. */
.collection{--w:clamp(100px,17vw,180px)}
.collection .club-cards .card,.formation .slot{width:var(--w)}
.collection .formation{gap:calc(var(--w)*.15)}
.formation .f-row:nth-child(2){gap:calc(var(--w)*1.2)}
.formation .f-row:nth-child(3){gap:calc(var(--w)*3.2)}
@media(max-width:600px){
  .collection{--w:25vw}
  .formation .f-row:nth-child(2){gap:calc(var(--w)*.5)}
  .formation .f-row:nth-child(3){gap:calc(var(--w)*1.5)}
}
.gal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.gal[hidden]{display:none}
.gal-box{text-align:center;color:#fff;max-width:92vw}
.gal-box img{max-height:72vh;max-width:86vw;width:auto;height:auto;border-radius:10px;transition:opacity .18s,transform .18s}
.gal-box img.out{opacity:0}
.gal-t{margin-top:12px;font-size:1.15rem}
.gal-pr{opacity:.85;margin-top:2px}
.gal-d{display:flex;gap:9px;justify-content:center;margin-top:12px}
.gal-d span{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35)}
.gal-d span.on{background:#fff}
.gal-h{margin-top:10px;font-size:.8rem;opacity:.7}
.gal-x,.gal-p,.gal-n{position:absolute;background:none;border:0;color:#fff;font-size:2.8rem;line-height:1;cursor:pointer;padding:12px}
.gal-x{top:4px;right:10px}
.gal-p{left:2px;top:50%;transform:translateY(-50%)}
.gal-n{right:2px;top:50%;transform:translateY(-50%)}
</style>
</head>

<script>
(function () {
  var id = new URLSearchParams(location.search).get("e");
  var t = NBA_EQUIPES.filter(function (x) { return x.id === id; })[0];
  if (!t) { document.getElementById("titre").textContent = "Équipe introuvable"; return; }
  var conf = t.conf === "est" ? ["basket-nba-est.html", "Conférence Est"] : ["basket-nba-ouest.html", "Conférence Ouest"];
  document.title = t.nom + " — CreaFut";
  document.getElementById("eyebrow").textContent = "NBA — " + conf[1];
  document.getElementById("titre").textContent = t.nom;
  var r = document.getElementById("retour");
  r.href = conf[0];
  r.textContent = "← Retour à la " + conf[1];

  /* URL complète (ex. 2e compte Cloudinary) = utilisée telle quelle ; sinon nom de fichier = compte principal */
  function src(u, w) {
    return /^https?:\/\//.test(u) ? u : NBA_BASE + "w_" + w + ",q_auto/" + encodeURI(u) + NBA_EXT;
  }

  var box = document.getElementById("cartes");

  /* Équipe avec formation */
  if (t.formation) {
    var f = t.formation;
    var postes = f.postes || {};
    var lg = document.getElementById("club-logo");
    lg.innerHTML = '<img src="' + src(f.logo || t.logo, 500) + '" alt="' + t.nom + '">';
    lg.style.display = "";
    box.style.display = "none";
    var z = document.getElementById("formation-zone");

    /* Un poste : liste de modèles [url, titre, prix]. Plusieurs modèles = boutons "Modèle 1/2/3". */
    function slot(code, num, label) {
      var m = postes[code];
      if (!m || !m.length) {
        return '<div class="slot empty"><div class="ph"><b>' + num + '</b><span>' + label + '</span><span>Bientôt</span></div></div>';
      }
      var p = m[0], prix = p[2] || "25 €";
      var btns = "";
      if (m.length > 1) {
        btns = '<div class="jeux">';
        m.forEach(function (x, k) {
          btns += '<button type="button" class="jeu-btn' + (k === 0 ? ' on' : '') + '" data-src="' + src(x[0], 600) +
                  '" data-alt="' + x[1] + '" data-title="' + x[1] + '">Modèle ' + (k + 1) + '</button>';
        });
        btns += '</div>';
      }
      return '<div class="slot"><div class="card"><div class="frame"><img src="' + src(p[0], 600) + '" alt="' + p[1] + '">' +
             '<h3>' + p[1] + '</h3><p class="price">' + prix + '</p>' + btns + '</div></div></div>';
    }

    var h = '';
    if ((f.club || []).length) {
      h += '<h2 class="club-cards-title">Cartes du club</h2><div class="grid club-cards">';
      f.club.forEach(function (c) {
        h += '<div class="card"><div class="frame"><img src="' + src(c[0], 600) + '" alt="' + c[1] + '">' +
             '<h3>' + c[1] + '</h3><p class="price">' + (c[2] || "20 €") + '</p></div></div>';
      });
      h += '</div>';
    }
    h += '<div class="formation">' +
         '<div class="f-row b-solo">' + slot("MEN", 1, "Meneur") + '</div>' +
         '<div class="f-row b-duo">' + slot("ARR", 2, "Arrière") + slot("AIL", 3, "Ailier") + '</div>' +
         '<div class="f-row b-duo">' + slot("AIF", 4, "Ailier fort") + slot("PIV", 5, "Pivot") + '</div>' +
         '</div>';
    z.innerHTML = h;
    z.style.display = "";
    return;
  }

  /* Équipe sans formation : grille habituelle */
  t.cartes.forEach(function (c) {
    var d = document.createElement("div");
    d.className = "card";
    d.innerHTML = '<div class="frame"><img src="' + src(c[0], 600) + '" alt="' + c[1] + '">' +
                  '<h3>' + c[1] + '</h3><p class="price">20 €</p></div>';
    box.appendChild(d);
  });
})();
</script>
<script>
/* Boutons de modèles + zoom des cartes de poste (repris de basket-betclic-asvel.html) */
document.querySelectorAll('.jeu-btn').forEach(function(b){b.addEventListener('click',function(){
var s=b.closest('.slot'),i=s.querySelector('img');
i.src=b.dataset.src;i.alt=b.dataset.alt;s.querySelector('h3').textContent=b.dataset.title;
s.querySelectorAll('.jeu-btn').forEach(function(x){x.classList.remove('on')});b.classList.add('on');});});
(function(){
var ov,img,tt,pr,dots,hint,px,pn,items=[],idx=0,slot=null,x0=0;
function build(){
ov=document.createElement('div');ov.className='gal';ov.setAttribute('role','dialog');ov.hidden=true;
ov.innerHTML='<button type="button" class="gal-x" aria-label="Fermer">×</button><button type="button" class="gal-p" aria-label="Précédent">‹</button><button type="button" class="gal-n" aria-label="Suivant">›</button><div class="gal-box"><img alt=""><div class="gal-t"></div><div class="gal-pr"></div><div class="gal-d"></div><div class="gal-h">Glissez pour voir les autres modèles</div></div>';
document.body.appendChild(ov);
img=ov.querySelector('img');tt=ov.querySelector('.gal-t');pr=ov.querySelector('.gal-pr');dots=ov.querySelector('.gal-d');hint=ov.querySelector('.gal-h');px=ov.querySelector('.gal-p');pn=ov.querySelector('.gal-n');
ov.querySelector('.gal-x').addEventListener('click',close);
px.addEventListener('click',function(e){e.stopPropagation();go(-1)});
pn.addEventListener('click',function(e){e.stopPropagation();go(1)});
ov.addEventListener('click',function(e){if(e.target===ov)close()});
ov.addEventListener('touchstart',function(e){x0=e.changedTouches[0].clientX},{passive:true});
ov.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(dx<0?1:-1)},{passive:true});
}
function show(){
var it=items[idx];img.src=it.src;img.alt=it.title;tt.textContent=it.title;pr.textContent=it.price;
dots.innerHTML='';var m=items.length>1;
items.forEach(function(_,k){var s=document.createElement('span');if(k===idx)s.className='on';dots.appendChild(s)});
dots.style.display=hint.style.display=px.style.display=pn.style.display=m?'':'none';
}
function go(d){if(items.length<2)return;img.classList.add('out');setTimeout(function(){idx=(idx+d+items.length)%items.length;show();img.classList.remove('out')},120)}
function open(s){
if(!ov)build();slot=s;var btns=s.querySelectorAll('.jeu-btn'),price=s.querySelector('.price').textContent;
if(btns.length){items=[].map.call(btns,function(b){return{src:b.dataset.src,title:b.dataset.title,price:price}});idx=Math.max(0,[].findIndex.call(btns,function(b){return b.classList.contains('on')}))}
else{var i=s.querySelector('img');items=[{src:i.src,title:s.querySelector('h3').textContent,price:price}];idx=0}
show();ov.hidden=false;document.body.style.overflow='hidden';
}
function close(){if(!ov||ov.hidden)return;ov.hidden=true;document.body.style.overflow='';
var btns=slot?slot.querySelectorAll('.jeu-btn'):[];if(btns.length&&btns[idx])btns[idx].click()}
document.addEventListener('click',function(e){
var im=e.target.closest&&e.target.closest('.slot:not(.empty) img');
if(!im)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();open(im.closest('.slot'));
},true);
document.addEventListener('keydown',function(e){
if(!ov||ov.hidden)return;
if(e.key==='Escape')close();else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
});
})();
</script>
