<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreaFut — Cartes collector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Marcellus&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0c0c0d;
    --charcoal: #161617;
    --gold: #c9a24b;
    --gold-soft: rgba(201,162,75,0.35);
    --cream: #f3ede1;
    --grey: #8b8b8b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--black);
    border-bottom: 2px solid var(--gold);
  }

  .nav {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 1.5rem;
  }

  .logo {
    font-family: 'Marcellus', serif;
    letter-spacing: 0.12em;
    font-size: 1.3rem;
    color: var(--gold);
  }

  .nav-links {
    display: flex;
    gap: 2.2rem;
    list-style: none;
    font-size: 0.92rem;
    letter-spacing: 0.03em;
  }

  .nav-links a {
    color: var(--cream);
    text-decoration: none;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s, color 0.2s;
  }

  .nav-links a:hover {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  .contact-badge {
    width: 36px;
    height: 36px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    text-decoration: none;
    font-size: 0.95rem;
  }

  .hero {
    text-align: center;
    padding: 4.5rem 1.5rem 3rem;
  }

  .hero .eyebrow {
    color: var(--gold);
    letter-spacing: 0.25em;
    font-size: 0.75rem;
    text-transform: uppercase;
  }

  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(2.6rem, 7vw, 4.2rem);
    color: var(--cream);
    margin-top: 0.5rem;
  }

  .divider {
    width: 90px;
    height: 2px;
    background: var(--gold);
    margin: 1.4rem auto 0;
  }

  section.collection {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1rem 1.5rem 5rem;
  }

  .category-title {
    text-align: center;
    font-family: 'Marcellus', serif;
    letter-spacing: 0.08em;
    color: var(--gold);
    font-size: 1.1rem;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 2rem 1.5rem;
  }

  .card {
    text-align: center;
  }

  .card .frame {
    background: var(--charcoal);
    border: 1px solid var(--gold-soft);
    border-radius: 4px;
    padding: 1.5rem 1.2rem 1.1rem;
    transition: border-color 0.25s, transform 0.25s;
  }

  .card .frame:hover {
    border-color: var(--gold);
    transform: translateY(-3px);
  }

  .card img {
    width: 100%;
    max-width: 170px;
    aspect-ratio: 3 / 4;
    object-fit: contain;
    display: block;
    margin: 0 auto 1rem;
  }

  .card h3 {
    font-family: 'Marcellus', serif;
    font-size: 1rem;
    letter-spacing: 0.04em;
    color: var(--cream);
  }

  .card .price {
    color: var(--gold);
    font-size: 0.9rem;
    margin-top: 0.35rem;
  }

  .contact {
    border-top: 2px solid var(--gold);
    padding: 3rem 1.5rem;
    text-align: center;
  }

  .contact h2 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.8rem;
    color: var(--cream);
  }

  .contact p { color: var(--grey); margin-top: 0.6rem; }

  .contact ul {
    list-style: none;
    margin-top: 1.3rem;
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .contact a {
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px solid var(--gold-soft);
  }

  footer {
    text-align: center;
    padding: 1.8rem;
    color: var(--grey);
    font-size: 0.8rem;
    border-top: 1px solid #222;
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo">CreaFut</div>
    <ul class="nav-links">
      <li><a href="#">Accueil</a></li>
      <li><a href="#">Collections</a></li>
      <li><a href="#collection">Galerie</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <a href="#contact" class="contact-badge" title="Contact">✉</a>
  </div>
</header>

<div class="hero">
  <p class="eyebrow">Cartes collector</p>
  <h1>La Collection</h1>
  <div class="divider"></div>
</div>

<section class="collection" id="collection">
  <p class="category-title">Sélection du moment</p>
  <div class="grid">

    <!-- Pour chaque carte : dupliquez ce bloc et changez l'URL Cloudinary, le nom et le prix -->
    <div class="card">
      <div class="frame">
        <img src="https://res.cloudinary.com/qwlhmio0/image/upload/Yamal.webp" alt="Yamal">
        <h3>Yamal</h3>
        <p class="price">20 €</p>
      </div>
    </div>

    <div class="card">
      <div class="frame">
        <img src="https://res.cloudinary.com/qwlhmio0/image/upload/Tillman.webp" alt="Tillman">
        <h3>Tillman</h3>
        <p class="price">20 €</p>
      </div>
    </div>

    <!-- Copiez ce bloc autant de fois que nécessaire -->

  </div>
</section>

<div class="contact" id="contact">
  <h2>Envie d'une carte ?</h2>
  <p>Écrivez-moi pour commander ou poser une question.</p>
  <ul>
    <li><a href="mailto:votre-email@exemple.com">Email</a></li>
    <li><a href="https://instagram.com/votre-compte">Instagram</a></li>
    <li><a href="https://paypal.me/votrenom">PayPal</a></li>
  </ul>
</div>

<footer>
  CreaFut — Cartes collector
</footer>

</body>
</html>
