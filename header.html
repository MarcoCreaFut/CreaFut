<style>
  @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap");
  #site-header-bar {
    --or: #c9a24a;
    --noir: #000;
    --creme: #f3ead7;
    background: var(--noir);
    border-bottom: 1px solid var(--or);
    font-family: "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
  }
  #site-header-bar .hdr-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  #site-header-bar .hdr-logo img {
    height: 58px;
    width: auto;
    display: block;
  }
  #site-header-bar nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 26px;
  }
  #site-header-bar nav a {
    color: var(--creme);
    text-decoration: none;
    font-style: italic;
    font-weight: 700;
    font-size: 17px;
    padding-bottom: 4px;
    border-bottom: 1px solid transparent;
    transition: color .2s, border-color .2s;
  }
  #site-header-bar nav a:hover,
  #site-header-bar nav a.active {
    color: var(--or);
    border-bottom-color: var(--or);
  }
  #site-header-bar .hdr-contact {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border: 1px solid var(--or);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--or);
    transition: background .2s, color .2s;
  }
  #site-header-bar .hdr-contact:hover {
    background: var(--or);
    color: var(--noir);
  }
  #site-header-bar .hdr-contact svg {
    width: 16px;
    height: 16px;
  }
  @media (max-width: 900px) {
    #site-header-bar .hdr-inner {
      flex-direction: column;
      padding: 14px 16px;
    }
    #site-header-bar nav a { font-size: 15px; }
  }
</style>
