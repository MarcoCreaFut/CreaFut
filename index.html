<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreaFut — Entre dans la légende</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Marcellus&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a24b;--gold-light:#f0d27a;--cream:#f3ede1}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{background:#050505;color:var(--cream);font-family:'Cormorant Garamond',serif;min-height:100vh;overflow-x:hidden;
background-image:radial-gradient(ellipse at 50% 30%,rgba(201,162,75,.16),transparent 60%),radial-gradient(ellipse at 50% 100%,rgba(201,162,75,.2),transparent 50%)}
.stage{max-width:940px;margin:0 auto;padding:18px 6px 60px;position:relative;overflow-x:clip}

/* ---------- Mise en page « Cartes collector » ---------- */
.collector{position:relative;container-type:inline-size;display:grid;grid-template-columns:24.4% minmax(0,1fr) 24.4%;grid-template-rows:auto 1fr;
grid-template-areas:"L CT R" "L CB R";column-gap:0;isolation:isolate}
.rays{position:absolute;left:50%;top:25%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;
background:repeating-conic-gradient(from 0deg,rgba(240,210,122,.20) 0 1.6deg,transparent 1.6deg 8deg);
-webkit-mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.55) 22%,transparent 52%);mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.55) 22%,transparent 52%)}
.glow{position:absolute;left:50%;top:34%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;
background:radial-gradient(circle,rgba(240,210,122,.42),rgba(201,162,75,.12) 45%,transparent 68%)}

.side{display:flex;flex-direction:column}
.side.left{grid-area:L}.side.right{grid-area:R}
.card{display:block;position:relative;z-index:1;margin-top:-13%;transition:transform .3s}
.card:first-child{margin-top:0}
.card img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 16px rgba(0,0,0,.65));transition:filter .3s}
.card:hover,.card:focus-visible{transform:translateY(-5px) scale(1.025);z-index:5;outline:none}
.card:hover img,.card:focus-visible img{filter:drop-shadow(0 0 20px rgba(240,210,122,.85))}
.side.left .card:nth-child(1){z-index:1}.side.left .card:nth-child(2){z-index:2}.side.left .card:nth-child(3){z-index:3}.side.left .card:nth-child(4){z-index:4}
.side.right .card:nth-child(1){z-index:1}.side.right .card:nth-child(2){z-index:2}.side.right .card:nth-child(3){z-index:3}.side.right .card:nth-child(4){z-index:4}

.center-top{grid-area:CT;padding:0 2.2cqw;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
.banner-wrap{position:relative;width:100%;padding-top:3.2cqw}
.crown{position:absolute;left:50%;top:0;transform:translateX(-50%);width:6.6cqw;color:var(--gold-light);background:#050505;padding:0 .6cqw;filter:drop-shadow(0 0 8px rgba(240,210,122,.6))}
.banner{border:2px solid var(--gold-light);border-radius:1.2cqw;background:linear-gradient(180deg,#000,#0b0905);box-shadow:0 0 26px rgba(201,162,75,.45),inset 0 0 0 4px #000,inset 0 0 0 5px rgba(240,210,122,.5);
padding:2.2cqw 1cqw;text-align:center;font-style:italic;font-weight:600;text-transform:uppercase;letter-spacing:.18em;font-size:clamp(7px,2.5cqw,28px);line-height:1;color:var(--gold-light);
display:flex;align-items:center;justify-content:center;gap:1.4cqw;white-space:nowrap}
.banner i{display:block;width:2cqw;height:2px;background:var(--gold)}
.logo-card{display:block;width:84%;margin:20cqw auto 0;position:relative;transition:transform .3s}
.logo-card img{display:block;width:100%;height:auto;filter:drop-shadow(0 0 22px rgba(240,210,122,.55)) drop-shadow(0 12px 18px rgba(0,0,0,.6));transition:filter .3s}
.logo-card:hover,.logo-card:focus-visible{transform:scale(1.03);outline:none}
.logo-card:hover img,.logo-card:focus-visible img{filter:drop-shadow(0 0 30px rgba(240,210,122,.95)) drop-shadow(0 12px 18px rgba(0,0,0,.6))}

.center-bottom{grid-area:CB;align-self:end;position:relative;z-index:0;margin:3.6cqw -3cqw 0;padding:5.2cqw 3.4cqw 2.4cqw;text-align:center;
border:2px solid var(--gold-light);border-radius:1.8cqw;background:linear-gradient(180deg,#000,#0a0805);
box-shadow:0 0 26px rgba(201,162,75,.4),inset 0 0 0 4px #000,inset 0 0 0 5px rgba(240,210,122,.45)}
.crown2{position:absolute;left:50%;top:-3.3cqw;transform:translateX(-50%);width:6.6cqw;color:var(--gold-light);background:#050505;padding:0 .6cqw;filter:drop-shadow(0 0 8px rgba(240,210,122,.6))}
h1{margin-top:0;font-style:italic;font-weight:600;text-transform:uppercase;line-height:1.02;color:var(--gold-light);text-shadow:0 0 22px rgba(201,162,75,.7),0 2px 6px #000}
h1 span{display:block;font-size:5.8cqw;white-space:nowrap}h1 span+span{font-size:4cqw}
.rule{height:1px;margin:1.6cqw auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.cols{display:grid;grid-template-columns:1fr 1px 1fr;gap:3%;margin:2.6cqw auto 0;align-items:start;text-align:center}
.cols .sep{background:linear-gradient(transparent,var(--gold),transparent);align-self:stretch}
.cols img{width:6.4cqw;mix-blend-mode:screen;margin:0 auto .6cqw;display:block}
.cols h2{font-style:italic;font-weight:600;text-transform:uppercase;color:var(--gold-light);font-size:clamp(8px,1.9cqw,22px);line-height:1.1;margin-bottom:.8cqw;white-space:nowrap}
.cols p{font-size:clamp(7.5px,1.78cqw,20px);line-height:1.22}
.btn{display:flex;align-items:center;justify-content:center;gap:1.2cqw;margin-top:2.6cqw;padding:1.6cqw .6cqw;border:2px solid var(--gold-light);border-radius:1.6cqw;background:#000;color:var(--gold-light);text-decoration:none;font-style:italic;font-weight:600;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;font-size:clamp(7.5px,1.78cqw,22px);box-shadow:0 0 26px rgba(201,162,75,.45);transition:.3s}
.btn:hover{background:var(--gold-light);color:#000;transform:translateY(-3px)}

@media (prefers-reduced-motion:reduce){.card,.logo-card,.btn{transition:none}}
</style>
<script>if(location.hash==="#contact"){location.replace("accueil.html#contact");}</script>
</head>
<body>
<main class="stage">
  <div class="collector">
    <div class="rays" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>

    <nav class="side left" aria-label="Collections">
      <a class="card" href="basket.html" aria-label="Basket"><img src="bienvenue-basket.webp" alt="Basket Collection" loading="lazy"></a>
      <a class="card" href="animes.html" aria-label="Animés"><img src="bienvenue-animes.webp" alt="Animés" loading="lazy"></a>
      <a class="card" href="personnalisation.html" aria-label="Personnalisation"><img src="bienvenue-personnalisation.webp" alt="Personnalisation — votre carte sur mesure" loading="lazy"></a>
      <a class="card" href="gaming.html" aria-label="Gaming"><img src="bienvenue-gaming.webp" alt="Gaming" loading="lazy"></a>
    </nav>

    <div class="center-top">
      <div class="banner-wrap">
        <svg class="crown" viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 32 L10 10 L22 22 L32 6 L42 22 L54 10 L58 32 Z"/><path d="M8 37 H56"/></svg>
        <div class="banner"><i></i>Cartes collector<i></i></div>
      </div>
      <a class="logo-card" href="accueil.html" aria-label="Marco CréaFut — accueil"><img src="bienvenue-logo.webp" alt="Marco CréaFut"></a>
    </div>

    <nav class="side right" aria-label="Collections">
      <a class="card" href="foot.html" aria-label="Football"><img src="bienvenue-foot.webp" alt="Football Collection" loading="lazy"></a>
      <a class="card" href="legendes.html" aria-label="Légendes"><img src="bienvenue-legendes.webp" alt="Légendes — Coupe du monde" loading="lazy"></a>
      <a class="card" href="hand.html" aria-label="Handball"><img src="bienvenue-hand.webp" alt="Handball Collection" loading="lazy"></a>
      <a class="card" href="supporters.html" aria-label="Supporters"><img src="bienvenue-supporters.webp" alt="Supporters" loading="lazy"></a>
    </nav>

    <div class="center-bottom">
      <svg class="crown2" viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 32 L10 10 L22 22 L32 6 L42 22 L54 10 L58 32 Z"/><path d="M8 37 H56"/></svg>
      <h1><span>Entre</span><span>dans la légende&nbsp;!!</span></h1>
      <div class="rule"></div>
      <div class="cols">
        <div><img src="bienvenue-icone1.jpg" alt=""><h2>Personnalisez<br>votre carte</h2><p>aux couleurs<br>de votre équipe.</p></div>
        <div class="sep"></div>
        <div><img src="bienvenue-icone2.jpg" alt=""><h2>Créez ta propre<br>carte</h2><p>comme un véritable<br>joueur professionnel.</p></div>
      </div>
      <a class="btn" href="accueil.html">Découvrir l'univers CreaFut <span>→</span></a>
    </div>
  </div>
</main>
</body>
</html>
