<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreaFut — Cartes collector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Marcellus&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0c0c0d;
    --charcoal: #161617;
    --gold: #c9a24b;
    --gold-soft: rgba(201,162,75,0.35);
    --cream: #f3ede1;
    --grey: #8b8b8b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--black);
    border-bottom: 2px solid var(--gold);
  }

  .nav {
    max-width: 1150px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 1.5rem;
  }

  .logo {
    font-family: 'Marcellus', serif;
    letter-spacing: 0.12em;
    font-size: 1.3rem;
    color: var(--gold);
    cursor: pointer;
    background: none;
    border: none;
  }

  .nav-links {
    display: flex;
    gap: 1.8rem;
    list-style: none;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
  }

  .nav-item { position: relative; }

  .nav-item > button {
    background: none;
    border: none;
    color: var(--cream);
    font: inherit;
    letter-spacing: inherit;
    cursor: pointer;
    padding: 0.4rem 0;
    border-bottom: 1px solid transparent;
  }

  .nav-item > button:hover,
  .nav-item.open > button {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  .dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    background: var(--charcoal);
    border: 1px solid var(--gold-soft);
    min-width: 190px;
    display: none;
    flex-direction: column;
    padding: 0.4rem 0;
    z-index: 30;
  }

  .nav-item.open .dropdown { display: flex; }

  .dropdown button {
    background: none;
    border: none;
    color: var(--cream);
    text-align: left;
    padding: 0.55rem 1.1rem;
    font: inherit;
    cursor: pointer;
  }

  .dropdown button:hover {
    background: rgba(201,162,75,0.12);
    color: var(--gold);
  }

  .contact-badge {
    width: 36px;
    height: 36px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    text-decoration: none;
    font-size: 0.95rem;
    flex-shrink: 0;
  }

  .hero {
    text-align: center;
    padding: 3.5rem 1.5rem 2.2rem;
  }

  .hero .eyebrow {
    color: var(--gold);
    letter-spacing: 0.25em;
    font-size: 0.75rem;
    text-transform: uppercase;
  }

  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(2.4rem, 6.5vw, 3.8rem);
    color: var(--cream);
    margin-top: 0.5rem;
  }

  .divider {
    width: 90px;
    height: 2px;
    background: var(--gold);
    margin: 1.3rem auto 0;
  }

  section.collection {
    max-width: 1150px;
    margin: 0 auto;
    padding: 1rem 1.5rem 5rem;
  }

  .category-title {
    text-align: center;
    font-family: 'Marcellus', serif;
    letter-spacing: 0.08em;
    color: var(--gold);
    font-size: 1.15rem;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
  }

  .empty-msg {
    text-align: center;
    color: var(--grey);
    font-size: 0.95rem;
    padding: 2rem 0;
    display: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 2rem 1.5rem;
  }

  .card { text-align: center; }

  .card .frame {
    background: var(--charcoal);
    border: 1px solid var(--gold-soft);
    border-radius: 4px;
    padding: 1.4rem 1.1rem 1rem;
    transition: border-color 0.25s, transform 0.25s;
  }

  .card .frame:hover {
    border-color: var(--gold);
    transform: translateY(-3px);
  }

  .card img {
    width: 100%;
    max-width: 165px;
    aspect-ratio: 3 / 4;
    object-fit: contain;
    display: block;
    margin: 0 auto 1rem;
  }

  .card h3 {
    font-family: 'Marcellus', serif;
    font-size: 0.98rem;
    letter-spacing: 0.03em;
    color: var(--cream);
  }

  .card .price {
    color: var(--gold);
    font-size: 0.88rem;
    margin-top: 0.35rem;
  }

  .contact {
    border-top: 2px solid var(--gold);
    padding: 3rem 1.5rem;
    text-align: center;
  }

  .contact h2 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.8rem;
    color: var(--cream);
  }

  .contact p { color: var(--grey); margin-top: 0.6rem; }

  .contact ul {
    list-style: none;
    margin-top: 1.3rem;
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .contact a {
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px solid var(--gold-soft);
  }

  footer {
    text-align: center;
    padding: 1.8rem;
    color: var(--grey);
    font-size: 0.8rem;
    border-top: 1px solid #222;
  }

  @media (max-width: 720px) {
    .nav-links { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <button class="logo" onclick="showCategory('all')">CreaFut</button>
    <ul class="nav-links" id="navLinks">

      <li class="nav-item">
        <button onclick="toggleDropdown(this)">Championnats ▾</button>
        <div class="dropdown">
          <button onclick="showCategory('france')">France</button>
          <button onclick="showCategory('angleterre')">Angleterre</button>
          <button onclick="showCategory('espagne')">Espagne</button>
          <button onclick="showCategory('italie')">Italie</button>
          <button onclick="showCategory('allemagne')">Allemagne</button>
        </div>
      </li>

      <li class="nav-item">
        <button onclick="toggleDropdown(this)">Sélections nationales ▾</button>
        <div class="dropdown">
          <button onclick="showCategory('can')">CAN</button>
          <button onclick="showCategory('coupe-du-monde')">Coupe du Monde</button>
        </div>
      </li>

      <li class="nav-item">
        <button onclick="toggleDropdown(this)">Animés ▾</button>
        <div class="dropdown">
          <button onclick="showCategory('dbz')">Dragon Ball Z</button>
          <button onclick="showCategory('captain-tsubasa')">Captain Tsubasa</button>
          <button onclick="showCategory('saint-seiya')">Saint Seiya</button>
          <button onclick="showCategory('one-piece')">One Piece</button>
          <button onclick="showCategory('pokemon')">Pokémon</button>
        </div>
      </li>

      <li class="nav-item">
        <button onclick="toggleDropdown(this)">Gaming ▾</button>
        <div class="dropdown">
          <button onclick="showCategory('call-of-duty')">Call of Duty</button>
          <button onclick="showCategory('gta')">GTA</button>
          <button onclick="showCategory('minecraft')">Minecraft</button>
        </div>
      </li>

      <li class="nav-item">
        <button onclick="document.getElementById('contact').scrollIntoView({behavior:'smooth'})">Contact</button>
      </li>

    </ul>
    <a href="#contact" class="contact-badge" title="Contact">✉</a>
  </div>
</header>

<div class="hero">
  <p class="eyebrow">Cartes collector</p>
  <h1 id="heroTitle">La Collection</h1>
  <div class="divider"></div>
</div>

<section class="collection" id="collection">
  <p class="category-title" id="categoryTitle">Toutes les cartes</p>

  <p class="empty-msg" id="emptyMsg">Aucune carte dans cette catégorie pour le moment — revenez bientôt !</p>

  <div class="grid" id="grid">

    <!-- CHAQUE CARTE : dupliquez ce bloc. Changez data-category selon la liste ci-dessous, l'URL Cloudinary, le nom et le prix.
    Valeurs possibles pour data-category :
    france, angleterre, espagne, italie, allemagne,
    can, coupe-du-monde,
    dbz, captain-tsubasa, saint-seiya, one-piece, pokemon,
    call-of-duty, gta, minecraft -->

    <div class="card" data-category="espagne">
      <div class="frame">
        <img src="https://res.cloudinary.com/qwlhmio0/image/upload/Yamal.webp" alt="Yamal">
        <h3>Yamal</h3>
        <p class="price">20 €</p>
      </div>
    </div>

    <div class="card" data-category="coupe-du-monde">
      <div class="frame">
        <img src="https://res.cloudinary.com/qwlhmio0/image/upload/Tillman.webp" alt="Tillman">
        <h3>Tillman</h3>
        <p class="price">20 €</p>
      </div>
    </div>

    <!-- Copiez ce bloc autant de fois que nécessaire pour ajouter vos cartes -->

  </div>
</section>

<div class="contact" id="contact">
  <h2>Envie d'une carte ?</h2>
  <p>Écrivez-moi pour commander ou poser une question.</p>
  <ul>
    <li><a href="mailto:votre-email@exemple.com">Email</a></li>
    <li><a href="https://instagram.com/votre-compte">Instagram</a></li>
    <li><a href="https://paypal.me/votrenom">PayPal</a></li>
  </ul>
</div>

<footer>
  CreaFut — Cartes collector
</footer>

<script>
  const categoryLabels = {
    all: "Toutes les cartes",
    france: "Championnat de France",
    angleterre: "Championnat d'Angleterre",
    espagne: "Championnat d'Espagne",
    italie: "Championnat d'Italie",
    allemagne: "Championnat d'Allemagne",
    "can": "Coupe d'Afrique des Nations",
    "coupe-du-monde": "Coupe du Monde",
    dbz: "Dragon Ball Z",
    "captain-tsubasa": "Captain Tsubasa",
    "saint-seiya": "Saint Seiya",
    "one-piece": "One Piece",
    pokemon: "Pokémon",
    "call-of-duty": "Call of Duty",
    gta: "GTA",
    minecraft: "Minecraft"
  };

  function showCategory(cat) {
    document.getElementById("categoryTitle").textContent = categoryLabels[cat] || cat;
    const cards = document.querySelectorAll(".card");
    let visibleCount = 0;

    cards.forEach(card => {
      const match = cat === "all" || card.dataset.category === cat;
      card.style.display = match ? "" : "none";
      if (match) visibleCount++;
    });

    document.getElementById("emptyMsg").style.display = visibleCount === 0 ? "block" : "none";

    // Ferme tous les menus déroulants ouverts et fait défiler vers la collection
    document.querySelectorAll(".nav-item.open").forEach(item => item.classList.remove("open"));
    document.getElementById("collection").scrollIntoView({behavior: "smooth"});
  }

  function toggleDropdown(button) {
    const item = button.parentElement;
    const wasOpen = item.classList.contains("open");
    document.querySelectorAll(".nav-item.open").forEach(el => el.classList.remove("open"));
    if (!wasOpen) item.classList.add("open");
  }

  // Ferme les menus si on clique ailleurs sur la page
  document.addEventListener("click", function(e) {
    if (!e.target.closest(".nav-item")) {
      document.querySelectorAll(".nav-item.open").forEach(el => el.classList.remove("open"));
    }
  });
</script>

</body>
</html>
